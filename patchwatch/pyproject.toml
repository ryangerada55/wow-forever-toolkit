[build-system]
# setuptools 77 or newer reads the SPDX license string below (PEP 639); older ones warned that
# the "license = { text = ... }" table stops working in 2027.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patchwatch"
version = "0.2.0"
description = "Tell a WoW addon team what a new World of Warcraft build changes for its addons"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
test = ["pytest>=7"]
lupa = ["lupa>=2"]

[project.scripts]
patchwatch = "patchwatch.cli:main"

[tool.setuptools]
packages = ["patchwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
